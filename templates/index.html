<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاستعلام عن بيانات الطالب</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Tahoma",sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:700px;
    text-align:center;
}
.logo{
    width:140px;
    height:auto;
    display:block;
    margin:0 auto 15px auto;
}
}

.school-name{
    color:#8c1d1d;
    font-size:34px;
    font-weight:bold;
    margin-bottom:5px;
}

.school-sub{
    color:#8c1d1d;
    font-size:24px;
    margin-bottom:45px;
}

.title{
    color:#8c1d1d;
    font-size:40px;
    font-weight:bold;
    margin-bottom:15px;
}

.subtitle{
    color:#666;
    font-size:20px;
    margin-bottom:35px;
}

.form-box{
    background:#faf7f4;
    border:1px solid #e3d8d0;
    border-radius:25px;
    padding:35px;
    text-align:right;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.label-top{
    font-size:22px;
    text-align:center;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:25px;
}

label{
    display:block;
    font-size:24px;
    font-weight:bold;
    margin-bottom:12px;
    color:#222;
}

input{
    width:100%;
    padding:18px;
    border:2px solid #d88f26;
    border-radius:15px;
    background:#eaf0fb;
    font-size:22px;
    text-align:right;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:15px;
    background:#ab1720;
    color:white;
    font-size:26px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#8c1118;
}
</style>
</head>

<body>

<div class="container">

    
    <!-- الشعار -->
   <img src="{{ url_for('static', filename='logo.jpg') }}">
       


       

    <!-- اسم المدرسة -->
    <div class="school-name">مدرسة أبو تمام</div>
    <div class="school-sub">للتعليم الأساسي (9-12)</div>

    <!-- العنوان -->
    <div class="title">الاستعلام عن بيانات الطالب</div>

    <div class="subtitle">
        يرجى إدخال اسم الطالب الثلاثي والولاية
    </div>

    <!-- نموذج البحث -->
    <div class="form-box">

        <div class="label-top">/</div>

        <div class="form-group">
            <label>اسم الطالب</label>
            <input type="text"
                   placeholder="أحمد بن هلال بن حمد سلطان المجلي">
        </div>

        <button type="submit">
            بحث
        </button>

    </div>

</div>

</body>
</html>
